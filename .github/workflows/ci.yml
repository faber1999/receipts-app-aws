name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the GitHub token: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, build and test
    runs-on: ubuntu-latest
    env:
      # Public, fake values: the build only needs them to pass the env validation (lib/env.ts).
      NEXT_PUBLIC_USER_POOL_ID: us-east-2_ci0000000
      NEXT_PUBLIC_USER_POOL_CLIENT_ID: ci-client-id
      NEXT_PUBLIC_API_URL: https://ci.invalid
    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format (Biome)
        run: pnpm check

      - name: Type-check packages
        run: pnpm typecheck

      # Before the tests: the WebStack test packages apps/web/out.
      - name: Build web
        run: pnpm --filter @receipts-app/web build

      - name: Unit and infrastructure tests
        run: pnpm test

  deploy:
    name: Deploy to AWS
    needs: verify
    # Only after a push to main, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time; a newer push waits instead of running in parallel.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Real, public values from the "production" environment variables.
      NEXT_PUBLIC_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_USER_POOL_ID }}
      NEXT_PUBLIC_USER_POOL_CLIENT_ID: ${{ vars.NEXT_PUBLIC_USER_POOL_CLIENT_ID }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This build is the one that gets deployed, so it uses the real values.
      - name: Build web
        run: pnpm --filter @receipts-app/web build

      # The github-deployer user can only assume the CDK bootstrap roles.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deploy all stacks
        working-directory: infra
        run: pnpm exec cdk deploy --all --require-approval never
